<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Надюши ♥</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#2a0a1f; --bg2:#5a1236; --rose:#ff4d7e; --blush:#ffc2d4; --cream:#fff1f4; --gold:#ffd27a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#2a0a1f;--bg2:#5a1236}}
:root[data-theme="dark"]{--bg1:#2a0a1f;--bg2:#5a1236}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 20%,var(--bg2),var(--bg1) 70%) fixed var(--bg1);
  color:var(--cream); font-family:Lora,Georgia,"Times New Roman",serif;
  overflow:hidden; display:flex; align-items:center; justify-content:center;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;width:min(92vw,560px);text-align:center;padding:16px}
.scene{display:none;animation:in .8s ease both}
.scene.on{display:block}
@keyframes in{from{opacity:0;transform:scale(.92) translateY(18px)}to{opacity:1;transform:none}}

.name{font-family:Caveat,"Segoe Script",cursive;font-size:clamp(3.6rem,19vw,9rem);line-height:.9;margin:0;
  background:linear-gradient(120deg,var(--blush),var(--rose) 50%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,77,126,.55))}
.sub{font-style:italic;color:var(--blush);font-size:1.15rem;margin:.6rem 0 2rem}
.beat{display:inline-block;font-size:3.2rem;color:var(--rose);animation:beat 1.2s infinite;filter:drop-shadow(0 0 14px var(--rose))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1)}45%{transform:scale(1.2)}}

h2{font-family:Caveat,cursive;font-size:clamp(2.4rem,9vw,3.6rem);margin:0 0 1.6rem;font-weight:700;line-height:1.1}
.row{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:90px}
button{font:600 1.15rem Lora,Georgia,serif;border:0;border-radius:999px;padding:.9rem 2.2rem;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#ff6b95,#e0245e);box-shadow:0 8px 28px rgba(224,36,94,.5);transition:transform .2s,box-shadow .2s}
button:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 34px rgba(224,36,94,.7)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button.no{background:rgba(255,255,255,.12);box-shadow:none;border:1px solid rgba(255,255,255,.3);position:relative;transition:transform .25s,left .25s,top .25s}
.yes{transform-origin:center}

.card{background:rgba(255,255,255,.07);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,194,212,.3);
  border-radius:28px;padding:1.8rem 1.4rem;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.poem{font-size:1.2rem;line-height:1.7;margin:0 0 1.6rem;max-height:46vh;overflow:auto}
.poem p{margin:0 0 1rem}
.poem span{display:block;opacity:0;transform:translateY(10px);animation:line .7s ease forwards}
@keyframes line{to{opacity:1;transform:none}}
.hint{font-size:.95rem;color:var(--blush);margin-top:1rem;min-height:1.4em;font-style:italic}
.final .big{font-family:Caveat,cursive;font-size:clamp(2.6rem,11vw,4.4rem);margin:0 0 .5rem;line-height:1.05}

@media (prefers-reduced-motion: reduce){
  .beat{animation:none}.scene{animation:none}
}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>

  <section class="scene on" id="s0">
    <div class="beat" aria-hidden="true">♥</div>
    <h1 class="name">Надюша</h1>
    <p class="sub">У меня для тебя кое-что есть…</p>
    <button class="go">Открыть</button>
  </section>

  <section class="scene" id="s1">
    <h2>Надюша, ты меня любишь?</h2>
    <div class="row">
      <button class="yes">Да ♥</button>
      <button class="no" id="no">Нет</button>
    </div>
    <p class="hint" id="hint"></p>
  </section>

  <section class="scene" id="s2">
    <div class="card">
      <div class="poem" id="poem"></div>
      <button class="go">Дальше ♥</button>
    </div>
  </section>

  <section class="scene" id="s3">
    <h2>А ты скучаешь, когда меня нет рядом?</h2>
    <div class="row">
      <button class="yes">Очень ♥</button>
      <button class="yes">Безумно ♥♥</button>
    </div>
  </section>

  <section class="scene" id="s4">
    <h2>Тогда пойдём со мной на свидание?</h2>
    <div class="row">
      <button class="yes">Конечно!</button>
      <button class="no" id="no2">Подумаю</button>
    </div>
    <p class="hint" id="hint2"></p>
  </section>

  <section class="scene final" id="s5">
    <div class="beat" aria-hidden="true">♥</div>
    <p class="big">Надюша, ты — моя любовь.</p>
    <p class="sub">Спасибо, что ты есть. Я счастлив рядом с тобой.<br>Жми на экран — пусть сердечки летят! ♥</p>
  </section>

</main>

<script>
(function(){
  // ---- фон: падающие сердечки ----
  var c=document.getElementById('bg'),x=c.getContext('2d'),W,H,hearts=[],bursts=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight}
  addEventListener('resize',size);size();
  var cols=['#ff4d7e','#ffc2d4','#ff7aa2','#ffd27a','#e0245e'];
  function mk(fromY){return{x:Math.random()*W,y:fromY??H+20,s:8+Math.random()*22,v:.4+Math.random()*1.1,
    w:Math.random()*Math.PI*2,c:cols[Math.random()*cols.length|0],a:.25+Math.random()*.5}}
  for(var i=0;i<40;i++)hearts.push(mk(Math.random()*H));
  function heart(px,py,s,col,a,rot){
    x.save();x.translate(px,py);x.rotate(rot||0);x.globalAlpha=a;x.fillStyle=col;x.shadowColor=col;x.shadowBlur=12;
    x.beginPath();x.moveTo(0,s/4);
    x.bezierCurveTo(0,-s/4,-s/2,-s/4,-s/2,s/8);
    x.bezierCurveTo(-s/2,s/2,0,s*.65,0,s*.85);
    x.bezierCurveTo(0,s*.65,s/2,s/2,s/2,s/8);
    x.bezierCurveTo(s/2,-s/4,0,-s/4,0,s/4);
    x.fill();x.restore();
  }
  function tick(){
    x.clearRect(0,0,W,H);
    hearts.forEach(function(h,i){
      h.y-=h.v;h.w+=.02;
      heart(h.x+Math.sin(h.w)*18,h.y,h.s,h.c,h.a,Math.sin(h.w)*.3);
      if(h.y<-40)hearts[i]=mk();
    });
    bursts=bursts.filter(function(b){return b.l>0});
    bursts.forEach(function(b){
      b.x+=b.vx;b.y+=b.vy;b.vy+=.12;b.l--;
      heart(b.x,b.y,b.s,b.c,Math.min(1,b.l/40),b.l*.05);
    });
    requestAnimationFrame(tick);
  }
  tick();
  function burst(px,py,n){
    for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,sp=2+Math.random()*7;
      bursts.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,s:10+Math.random()*20,c:cols[Math.random()*cols.length|0],l:80+Math.random()*60})}
  }

  // ---- сцены ----
  var cur=0;
  function show(n){
    document.getElementById('s'+cur).classList.remove('on');
    cur=n;document.getElementById('s'+n).classList.add('on');
    if(n===2)poem();
  }
  document.querySelectorAll('.go,.yes').forEach(function(b){
    b.addEventListener('click',function(e){
      var r=b.getBoundingClientRect();
      if(b.classList.contains('yes'))burst(r.left+r.width/2,r.top,70);
      setTimeout(function(){show(cur+1)},b.classList.contains('yes')?450:0);
    });
  });

  // ---- убегающая кнопка «Нет» ----
  var msgs=['Ну пожалуйста… ♥','Ты же не это хотела нажать 😏','Кнопка «Да» слева, она больше!','Не-а, не поймаешь!','Сердечко разобьёшь 💔','Ладно-ладно, жми «Да»'];
  function dodge(id,hid){
    var b=document.getElementById(id),h=document.getElementById(hid),k=0,yes=b.parentNode.querySelector('.yes');
    function run(e){
      e.preventDefault();
      var dx=(Math.random()-.5)*Math.min(innerWidth*.6,320),dy=(Math.random()-.5)*220;
      b.style.transform='translate('+dx+'px,'+dy+'px) rotate('+((Math.random()-.5)*30)+'deg)';
      h.textContent=msgs[k%msgs.length];k++;
      yes.style.transform='scale('+Math.min(1+k*.15,2)+')';
      yes.style.margin=(k*6)+'px';
    }
    b.addEventListener('mouseenter',run);
    b.addEventListener('touchstart',run,{passive:false});
    b.addEventListener('click',run);
  }
  dodge('no','hint');dodge('no2','hint2');

  // ---- стишок по строчкам ----
  var verses=[
    ['Надюша — имя как тихий свет,','Лучше тебя на свете нет.','Улыбнёшься — и день теплей,','Ты для сердца всего родней.'],
    ['Я люблю тебя без «потом»,','Без «когда-нибудь», просто сейчас.','Ты мой дом, мой весенний гром,','Самый тёплый на свете час.'],
    ['Пусть за окном хоть снег, хоть дождь —','С тобой мне всегда весна.','И в целом мире ты не найдёшь','Влюблённей меня сполна.']
  ];
  function poem(){
    var box=document.getElementById('poem'),d=0;box.innerHTML='';
    verses.forEach(function(v){
      var p=document.createElement('p');
      v.forEach(function(t){var s=document.createElement('span');s.textContent=t;s.style.animationDelay=(d+=.9)+'s';p.appendChild(s)});
      box.appendChild(p);
    });
    setTimeout(function(){burst(innerWidth/2,innerHeight/3,60)},400);
  }

  // ---- финал: сердечки по клику ----
  addEventListener('pointerdown',function(e){if(cur===5)burst(e.clientX,e.clientY,35)});
  var obs=setInterval(function(){if(cur===5)burst(Math.random()*innerWidth,innerHeight*.9,12)},700);
})();
</script>
</body>
</html>
